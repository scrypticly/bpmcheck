<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11111b">
  <title>BPM Checker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand-mark" aria-hidden="true">♫</div>
      <p class="eyebrow">AUDIO TOOL</p>
      <h1>BPM <span>Checker</span></h1>
      <p class="subtitle">Find the tempo of any song in seconds.</p>
    </header>

    <section class="panel" aria-label="Audio BPM analyzer">
      <label class="drop-zone" id="dropZone" for="audioFile">
        <span class="upload-icon" aria-hidden="true">↑</span>
        <strong>Drop an audio file here</strong>
        <span class="drop-hint">or click to browse your device</span>
        <span class="file-types">MP3 · WAV · OGG · M4A · FLAC*</span>
        <input id="audioFile" type="file" accept="audio/*">
      </label>

      <div class="file-info" id="fileInfo" hidden>
        <div class="file-icon" aria-hidden="true">♫</div>
        <div class="file-copy">
          <strong id="fileName">audio.mp3</strong>
          <span id="fileMeta">Ready to analyze</span>
        </div>
        <button class="text-button" id="removeFile" type="button" aria-label="Remove audio file">✕</button>
      </div>

      <section class="player" id="player" hidden aria-label="Audio playback">
        <div class="player-controls">
          <button class="play-button" id="playButton" type="button" aria-label="Play audio" disabled>
            <span id="playIcon" aria-hidden="true">▶</span>
          </button>
          <div class="timeline">
            <input class="seek-bar" id="seekBar" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek through audio" disabled>
            <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
          </div>
        </div>
        <label class="metronome-toggle" for="metronomeEnabled">
          <input id="metronomeEnabled" type="checkbox" checked>
          <span class="toggle-check" aria-hidden="true"></span>
          <span class="metronome-copy"><strong>Metronome</strong><small id="metronomeStatus">Turns on after BPM analysis</small></span>
          <span class="metronome-bpm" id="metronomeBpm">— BPM</span>
        </label>
      </section>

      <button class="analyze-button" id="analyzeButton" type="button" disabled>
        <span class="button-label">Analyze BPM</span>
        <span class="button-arrow" aria-hidden="true">→</span>
      </button>

      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-top">
          <span id="statusText">Analyzing audio…</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>

      <section class="result" id="result" aria-live="polite" hidden>
        <p class="result-label">ESTIMATED TEMPO</p>
        <div class="bpm-line"><strong id="bpmValue">--</strong><span>BPM</span></div>
        <p class="result-note" id="resultNote">Analysis complete.</p>
        <button class="text-button retry-button" id="retryButton" type="button">Analyze another file</button>
      </section>

      <p class="error" id="errorMessage" role="alert" hidden></p>
    </section>

    <footer>
      <p>Your audio is analyzed locally in your browser. It is never uploaded.</p>
      <p class="footnote">*Audio format support depends on your browser.</p>
    </footer>
  </main>
</body>
</html>
